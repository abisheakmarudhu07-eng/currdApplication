# Optional MySQL container for developers who do not use an installed MySQL server.
# The normal `npm run cold-start` does NOT start this service.
# If used, connect with MYSQL_HOST=127.0.0.1 and MYSQL_PORT=MYSQL_DOCKER_PORT,
# then create/check the application and migration accounts using the admin SQL docs.
services:
  mysql:
    profiles: ["docker-mysql"]
    image: mysql:8.0.36
    container_name: currd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_fitness_tracker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_DOCKER_ROOT_PASSWORD:?Set MYSQL_DOCKER_ROOT_PASSWORD only when using optional Docker MySQL}
    ports:
      - "127.0.0.1:${MYSQL_DOCKER_PORT:-3307}:3306"
    volumes:
      - currd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  currd_mysql_data:
